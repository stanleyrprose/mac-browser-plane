name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[browser,dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Core tests
        run: python -m unittest -v tests.test_core
      - name: C0 mini soak
        run: python scripts/soak_m1.py --jobs 100 --browser-jobs 0 --submitters 4
