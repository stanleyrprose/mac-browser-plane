[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-browser-plane"
version = "0.1.0"
description = "Mac-centric local browser execution plane"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
agent = ["mcp==2.1.1"]
dev = ["pytest>=8,<9"]

[project.scripts]
browserctl = "browser_plane.cli:main"
mac-browser-mcp = "browser_plane.mcp_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_plane = ["capabilities.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
